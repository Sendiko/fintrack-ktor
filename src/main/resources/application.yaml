ktor:
    application:
        modules:
            - id.my.sendiko.ApplicationKt.module
    deployment:
        port: "$APP_PORT:3000"
jwt:
    domain: "$JWT_DOMAIN:https://fintrack.sendiko.my.id/"
    audience: "$JWT_AUDIENCE:fintrack-users"
    realm: "$JWT_REALM:fintrack"
    secret: "$JWT_SECRET:super-secret-jwt-key"
ollama:
    host: "$OLLAMA_HOST:http://localhost:11434"
    model: "$OLLAMA_MODEL:llama3.2:3b"
